name: moda_store
description: "Moda - متجر أزياء نسائية (أحذية، شنط، نظارات شمسية، إكسسوارات)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

  # ---------------- Firebase (السيرفر) ----------------
  # القيود مفتوحة عمداً عشان pub يختار أحدث نسخة متوافقة مع Flutter عندك.
  # لو ظهرت مشكلة في تحميل الحزم، نفّذ الأمر ده وهو هيظبطها لوحده:
  #   flutter pub add firebase_core cloud_firestore firebase_auth firebase_storage
  firebase_core: '>=3.0.0'
  cloud_firestore: '>=5.0.0'
  firebase_auth: '>=5.0.0'
  firebase_storage: '>=12.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
